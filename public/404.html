<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>404 - 找不到頁面 | FFXIV 罕見天氣預報</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e0e6ed;
      min-height: 100vh;
      background: radial-gradient(circle at top center, #1a2a44 0%, #0a0e17 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px 20px;
    }

    h1 {
      margin: 0;
      font-size: 8em;
      font-weight: 800;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #00ffff 0%, #0088ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.3));
      line-height: 1;
    }

    h2 {
      font-size: 2em;
      margin: 20px 0 10px;
      color: #fff;
    }

    p {
      color: #556781;
      font-size: 1.1em;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #00ffff 0%, #0088ff 100%);
      border: none;
      color: #0a0e17;
      padding: 15px 40px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 50px;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      box-shadow: 0 4px 15px rgba(0, 255, 255, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 255, 255, 0.4);
    }

    .aether-leak {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      background: #00ffff;
      border-radius: 50%;
      opacity: 0.3;
      filter: blur(2px);
      animation: float 15s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      80% { opacity: 0.3; }
      100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="aether-leak">
    <!-- Animated background elements -->
    <div class="particle" style="width: 4px; height: 4px; left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="width: 6px; height: 6px; left: 30%; animation-delay: 2s;"></div>
    <div class="particle" style="width: 3px; height: 3px; left: 55%; animation-delay: 5s;"></div>
    <div class="particle" style="width: 5px; height: 5px; left: 80%; animation-delay: 1s;"></div>
    <div class="particle" style="width: 4px; height: 4px; left: 90%; animation-delay: 8s;"></div>
  </div>

  <div class="container">
    <h1>404</h1>
    <h2>迷失在以太中...</h2>
    <p>看來你來到了一個沒有特殊天氣的位面。<br>或者是通往此處的傳送水晶失效了。</p>
    <a href="/" class="btn">返回預報首頁</a>
  </div>
</body>
</html>
